[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ibox"
version = "0.1.0"
description = "说人话找终端命令，看懂 AI 在终端里干什么（macOS / Windows）"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[project.scripts]
ibox = "ibox.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ibox = ["data/cards/*.md"]
