[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ibox"
version = "0.3.7"
description = "灯下工具箱，查 Windows 本机状态，探索文件和软件的运行原理"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[project.scripts]
ibox = "ibox.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ibox = ["data/cards/*.md", "data/tools/*/src/*", "data/tools/LICENSE"]
