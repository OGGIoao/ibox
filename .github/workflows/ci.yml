name: CI

on:
  push:
  pull_request:

jobs:
  baseline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"
      - name: Compile Python sources
        run: python -m compileall -q terminal-toolbox scripts tests
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Check HTML links
        run: python scripts/check_html_links.py
