<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>放映 · §6 功耗平方律</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --klein:#002FA7; --klein-bright:#1A4FD0;
  --bg:#0E0E10; --bg2:#141417;
  --ink:#EDEDF0; --dim:#86868C; --hair:#2A2A31;
  --stage:#5F5E5A; --result:#E24B4A; --attacker:#E24B4A;
  --chip:#002FA7; --pipe:#0E5A9C; --branch:#7F77DD; --cache:#2E7D8E;
  --power:#B8791F; --parallel:#2F7D5E;
  --dock:156px;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Inter","Helvetica Neue",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;display:flex;flex-direction:column;height:100vh;overflow:hidden;-webkit-font-smoothing:antialiased}
header{height:54px;flex:0 0 54px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid var(--hair);background:var(--bg2)}
.cast{display:flex;align-items:center;gap:16px}
.cast .role{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dim)}
.cast .role svg{width:18px;height:18px;color:inherit}
.cast .role b{color:var(--ink);font-weight:600}
.crumb{font-size:13px;letter-spacing:.18em;color:var(--ink);border:1px solid var(--hair);padding:5px 12px}
.canvas{flex:1 1 auto;display:flex;align-items:flex-end;justify-content:center;position:relative;padding:10px 24px 6px;min-height:0}
.stage-svg{width:100%;max-width:1000px;height:auto;display:block}
.dock{flex:0 0 156px;height:156px;display:flex;align-items:center;gap:22px;padding:0 26px;border-top:1px solid var(--hair);background:var(--bg2)}
.avatar{flex:0 0 64px;width:64px;height:64px;border:1px solid var(--hair);display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink)}
.avatar svg{width:40px;height:40px;color:inherit}
.avatar .z{font-size:26px;font-weight:700;color:var(--dim)}
.speaker{flex:0 0 96px;font-size:12px;color:var(--dim);line-height:1.4}
.speaker b{display:block;font-size:15px;color:var(--ink);font-weight:600;margin-bottom:2px}
.lines{flex:1 1 auto;font-size:22px;line-height:1.55;font-weight:500;letter-spacing:.01em;min-height:0}
.lines .line{opacity:0;animation:fadein .18s forwards}
@keyframes fadein{to{opacity:1}}
.controls{flex:0 0 auto;display:flex;flex-direction:column;gap:10px;align-items:stretch}
button{font-family:inherit;background:transparent;color:var(--ink);border:1px solid var(--hair);padding:10px 16px;font-size:14px;cursor:pointer;letter-spacing:.04em;transition:border-color .15s,color .15s,background .15s}
button:hover{border-color:var(--klein-bright);color:#fff}
button.step{border-color:var(--klein);color:#cdd6ff}
button.step:hover{background:var(--klein);color:#fff}
button:disabled{opacity:.32;cursor:default;border-color:var(--hair);color:var(--dim)}
.nav-row{display:flex;gap:10px}
.hint{font-size:11px;color:var(--dim);letter-spacing:.04em}

/* §6 specifics */
.scene{opacity:0;transition:opacity .4s ease;pointer-events:none}
.scene.show{opacity:1}
.dot{opacity:0}
.dot .core{fill:currentColor}
.dot .glow{fill:currentColor;opacity:.22}
.handle{cursor:ew-resize}
#vHandle{fill:var(--power)} #fHandle{fill:var(--parallel)}
</style>
</head>
<body>

<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <symbol id="role-chip" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6"><rect x="6" y="6" width="12" height="12"/><rect x="9.5" y="9.5" width="5" height="5"/><line x1="8" y1="6" x2="8" y2="3"/><line x1="12" y1="6" x2="12" y2="3"/><line x1="16" y1="6" x2="16" y2="3"/><line x1="8" y1="18" x2="8" y2="21"/><line x1="12" y1="18" x2="12" y2="21"/><line x1="16" y1="18" x2="16" y2="21"/><line x1="6" y1="8" x2="3" y2="8"/><line x1="6" y1="12" x2="3" y2="12"/><line x1="6" y1="16" x2="3" y2="16"/><line x1="18" y1="8" x2="21" y2="8"/><line x1="18" y1="12" x2="21" y2="12"/><line x1="18" y1="16" x2="21" y2="16"/></g></symbol>
  <symbol id="role-pipe" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6"><line x1="3" y1="15" x2="20" y2="15"/><line x1="3" y1="19" x2="20" y2="19"/><rect x="4" y="11" width="3" height="4"/><rect x="9.5" y="11" width="3" height="4"/><rect x="15" y="11" width="3" height="4"/><path d="M20 14 L23 17 L20 20"/></g></symbol>
  <symbol id="role-branch" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6"><line x1="12" y1="21" x2="12" y2="11"/><path d="M12 5 L15 8 L12 11 L9 8 Z"/><line x1="11" y1="7" x2="5" y2="3"/><line x1="13" y1="7" x2="19" y2="3" stroke-dasharray="2 2"/></g></symbol>
  <symbol id="role-cache" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="3" width="16" height="18"/><line x1="4" y1="9" x2="20" y2="9"/><line x1="4" y1="15" x2="20" y2="15"/><rect x="13" y="4.5" width="4" height="3"/><rect x="11" y="10.5" width="5" height="3"/><rect x="9" y="16.5" width="6" height="3"/></g></symbol>
  <symbol id="role-power" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6"><rect x="5" y="7" width="12" height="11"/><rect x="17" y="10" width="2.5" height="5"/><path d="M12 9 L9 14 L12 14 L10.5 18 L15 12.5 L12 12.5 Z" fill="currentColor" stroke="currentColor"/></g></symbol>
  <symbol id="role-parallel" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6"><line x1="4" y1="6" x2="17" y2="6"/><path d="M17 6 L14 4 M17 6 L14 8"/><line x1="4" y1="12" x2="17" y2="12"/><path d="M17 12 L14 10 M17 12 L14 14"/><line x1="4" y1="18" x2="17" y2="18"/><path d="M17 18 L14 16 M17 18 L14 20"/></g></symbol>
  <symbol id="role-stage" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="16" height="12"/><path d="M7 16 L7 20 L12 16 Z"/></g></symbol>
  <symbol id="role-result" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 4 L21 20 L3 20 Z"/><line x1="12" y1="9" x2="12" y2="14"/><line x1="12" y1="17" x2="12" y2="17.6"/></g></symbol>
  <symbol id="role-attacker" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6"><rect x="5" y="10" width="14" height="10"/><path d="M8 10 V7 a4 4 0 0 1 8 0 V10"/><circle cx="12" cy="14.5" r="1.3"/><line x1="12" y1="15.8" x2="12" y2="17.5"/></g></symbol>
</svg>

<header>
  <div class="cast">
    <div class="role" style="color:var(--stage)"><svg viewBox="0 0 24 24"><use href="#role-stage"/></svg><b>场务</b></div>
    <div class="role" style="color:var(--power)"><svg viewBox="0 0 24 24"><use href="#role-power"/></svg><b>电压</b></div>
    <div class="role" style="color:var(--chip)"><svg viewBox="0 0 24 24"><use href="#role-chip"/></svg><b>小核 E</b></div>
  </div>
  <div class="crumb">场6 · 功耗平方律</div>
</header>

<main class="canvas">
  <svg class="stage-svg" viewBox="0 0 960 540" id="svg" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="context-stroke"/></marker>
    </defs>

    <!-- 场景 SL：V / f 滑块 + 功耗曲线 -->
    <g class="scene" id="scSL">
      <line x1="120" y1="380" x2="820" y2="380" stroke="var(--hair)"/>
      <line x1="120" y1="380" x2="120" y2="120" stroke="var(--hair)"/>
      <text x="470" y="408" text-anchor="middle" font-size="12" fill="var(--dim)">电压 V（向左降 →）</text>
      <text x="86" y="135" font-size="12" fill="var(--dim)" transform="rotate(-90 86 135)">功耗</text>
      <path id="curveV" d="M120 380 Q 470 380, 820 120" fill="none" stroke="var(--power)" stroke-width="2"/>
      <circle id="mV" r="6" fill="var(--power)"/>
      <line x1="120" y1="380" x2="820" y2="380" stroke="var(--hair)" stroke-dasharray="3 4" opacity=".5"/>
      <text x="120" y="462" font-size="11" fill="var(--dim)">低 V</text>
      <text x="800" y="462" font-size="11" fill="var(--dim)">高 V</text>
      <line id="vTrack" x1="120" y1="440" x2="820" y2="440" stroke="var(--hair)" stroke-width="2"/>
      <rect id="vHandle" class="handle" x="700" y="430" width="18" height="20"/>
      <text x="470" y="498" text-anchor="middle" font-size="12" fill="var(--dim)">频率 f（向左降 → 平缓）</text>
      <line id="fTrack" x1="120" y1="512" x2="820" y2="512" stroke="var(--hair)" stroke-width="2"/>
      <rect id="fHandle" class="handle" x="700" y="502" width="18" height="20"/>
      <text id="pRead" x="480" y="92" text-anchor="middle" font-size="20" fill="#9db4ff">功耗 ≈ V² × f = 100%</text>
    </g>

    <!-- 场景 M5：实测 E / P 核 -->
    <g class="scene" id="scM5">
      <rect id="eCore" x="180" y="200" width="140" height="90" fill="var(--bg2)" stroke="var(--parallel)"/>
      <text x="250" y="246" text-anchor="middle" font-size="15" fill="var(--parallel)">E 核</text>
      <text id="eState" x="250" y="272" text-anchor="middle" font-size="12" fill="var(--ink)">扛轻活</text>
      <rect id="pCore" x="640" y="200" width="140" height="90" fill="var(--bg2)" stroke="var(--hair)"/>
      <text x="710" y="246" text-anchor="middle" font-size="15" fill="var(--dim)">P 核</text>
      <text id="pState" x="710" y="272" text-anchor="middle" font-size="12" fill="var(--dim)">睡眠</text>
      <rect x="400" y="118" width="160" height="22" fill="none" stroke="var(--hair)"/>
      <rect id="pMeter" x="402" y="120" width="40" height="18" fill="var(--power)"/>
      <text id="pWatt" x="480" y="170" text-anchor="middle" font-size="13" fill="var(--ink)">整机电功率：低</text>
      <path id="pM5e" d="M250 290 L250 330" fill="none" stroke="var(--hair)"/>
      <path id="pM5p" d="M710 290 L710 330" fill="none" stroke="var(--hair)"/>
      <g class="dot" id="dM5e"><circle class="glow" r="8"/><circle class="core" r="3.5"/></g>
      <g class="dot" id="dM5p"><circle class="glow" r="8"/><circle class="core" r="3.5"/></g>
    </g>
  </svg>
</main>

<footer class="dock">
  <div class="avatar" id="avatar"><span class="z">Z</span></div>
  <div class="speaker"><b id="spk-name">场务</b><span id="spk-role">客观背景 / 真机数字</span></div>
  <div class="lines" id="lines"></div>
  <div class="controls">
    <button class="step" id="step">下一步 ▸</button>
    <div class="nav-row">
      <button class="nav" id="prev">◂ 上一幕</button>
      <button class="nav" id="next" disabled>下一跳②计算单元</button>
    </div>
  </div>
</footer>

<script>
const svgns="http://www.w3.org/2000/svg";
const svg=document.getElementById('svg');
const avatar=document.getElementById('avatar');
const spkName=document.getElementById('spk-name');
const spkRole=document.getElementById('spk-role');
const linesBox=document.getElementById('lines');
const stepBtn=document.getElementById('step');
const prevBtn=document.getElementById('prev');
const nextBtn=document.getElementById('next');

const ROLE={
  stage:{name:'场务', sub:'客观背景 / 真机数字', color:'var(--stage)', icon:'role-stage'},
  power:{name:'电压', sub:'V²', color:'var(--power)', icon:'role-power'},
  ecore:{name:'小核 E', sub:'低压点', color:'var(--chip)', icon:'role-chip'},
};

function setAvatar(key){
  const r=ROLE[key]; if(!r) return;
  avatar.innerHTML='';
  const s=document.createElementNS(svgns,'svg'); s.setAttribute('viewBox','0 0 24 24');
  const u=document.createElementNS(svgns,'use'); u.setAttribute('href','#'+r.icon); s.appendChild(u); avatar.appendChild(s);
  avatar.style.color=r.color;
  spkName.textContent=r.name; spkRole.textContent=r.sub||'';
}
function setScene(id){
  document.querySelectorAll('.scene').forEach(g=>{ if(g.id===id) g.classList.add('show'); else g.classList.remove('show'); });
}
function flowDots(pathEl, dots, dur){
  return new Promise(res=>{
    if(!pathEl){res();return;}
    const len=pathEl.getTotalLength(); const n=dots.length;
    dots.forEach(d=>d.style.opacity=1);
    let start=null;
    function frame(t){
      if(start===null)start=t;
      let p=(t-start)/dur; if(p>1)p=1;
      dots.forEach((d,i)=>{
        let f=p - i/n; if(f<0)f+=1;
        const pt=pathEl.getPointAtLength(f*len);
        d.setAttribute('transform','translate('+pt.x+','+pt.y+')');
      });
      if(p<1) requestAnimationFrame(frame); else res();
    }
    requestAnimationFrame(frame);
  });
}
function wait(ms){return new Promise(r=>setTimeout(r,ms));}
function typeLines(arr){
  linesBox.innerHTML='';
  return new Promise(res=>{
    let i=0;
    (function nxt(){
      if(i>=arr.length){res();return;}
      const p=document.createElement('p'); p.className='line';
      linesBox.appendChild(p);
      const txt=arr[i]; let c=0;
      const iv=setInterval(()=>{
        p.textContent=txt.slice(0,++c);
        if(c>=txt.length){clearInterval(iv); i++; setTimeout(nxt,150);}
      },24);
    })();
  });
}

/* ---- slider logic ---- */
const STATE={V:1.0, f:1.0};
const curveV=document.getElementById('curveV');
const mV=document.getElementById('mV');
const vHandle=document.getElementById('vHandle');
const fHandle=document.getElementById('fHandle');
const pRead=document.getElementById('pRead');
function updatePower(){
  const t=(STATE.V-0.6)/0.6;
  const pt=curveV.getPointAtLength(Math.max(0,Math.min(1,t))*curveV.getTotalLength());
  mV.setAttribute('cx',pt.x); mV.setAttribute('cy',pt.y);
  vHandle.setAttribute('x', (120+(STATE.V-0.6)/0.6*700)-9);
  fHandle.setAttribute('x', (120+(STATE.f-0.5)/1.0*700)-9);
  pRead.textContent='功耗 ≈ V² × f = '+Math.round(STATE.V*STATE.V*STATE.f*100)+'%';
}
function clientXtoSvgX(clientX){
  const r=svg.getBoundingClientRect();
  return (clientX-r.left)/r.width*960;
}
let dragging=null, justSlider=false;
function bindSlider(handle, track, axis){
  function setFromX(x){
    x=Math.max(120,Math.min(820,x));
    if(axis==='V'){ STATE.V=0.6+(x-120)/700*0.6; }
    else { STATE.f=0.5+(x-120)/700*1.0; }
    updatePower();
  }
  function down(e){ e.preventDefault(); dragging=axis; justSlider=true; setFromX(clientXtoSvgX((e.touches?e.touches[0].clientX:e.clientX))); }
  function move(e){ if(dragging!==axis) return; setFromX(clientXtoSvgX((e.touches?e.touches[0].clientX:e.clientX))); }
  function up(){ dragging=null; justSlider=false; }
  handle.addEventListener('pointerdown',down);
  track.addEventListener('pointerdown',down);
  window.addEventListener('pointermove',move);
  window.addEventListener('pointerup',up);
}
bindSlider(vHandle,document.getElementById('vTrack'),'V');
bindSlider(fHandle,document.getElementById('fTrack'),'f');

async function animateV(from,to,dur){
  let start=null;
  await new Promise(res=>{
    function fr(t){
      if(start===null)start=t;
      let p=(t-start)/dur; if(p>1)p=1;
      STATE.V=from+(to-from)*p; updatePower();
      if(p<1) requestAnimationFrame(fr); else res();
    }
    requestAnimationFrame(fr);
  });
}

async function animSlider(){
  setScene('scSL');
  await wait(200);
  await animateV(1.0, 0.8, 900);
  await wait(400);
}
async function animM5(){
  setScene('scM5');
  document.getElementById('eState').textContent='扛轻活';
  document.getElementById('pState').textContent='睡眠';
  document.getElementById('pCore').setAttribute('stroke','var(--hair)');
  document.getElementById('pWatt').textContent='整机电功率：低';
  document.getElementById('pMeter').setAttribute('width','40');
  const dE=document.getElementById('dM5e'); dE.style.color='var(--parallel)';
  await flowDots(document.getElementById('pM5e'),[dE],1400);
  document.getElementById('pState').textContent='拉起重活';
  document.getElementById('pCore').setAttribute('stroke','var(--chip)');
  document.getElementById('eState').textContent='退居';
  document.getElementById('pWatt').textContent='整机电功率：跳升';
  document.getElementById('pMeter').setAttribute('width','150');
  const dP=document.getElementById('dM5p'); dP.style.color='var(--chip)';
  await flowDots(document.getElementById('pM5p'),[dP],1400);
}

const STEPS=[
  {role:'stage', lines:['性能，不是免费午餐。','代价是功耗和发热。']},
  {role:'power', anim:animSlider, lines:['我是平方。','同性能下，降我比降频率，','省电得多。']},
  {role:'stage', lines:['这就是 DVFS，','也是小核存在的物理根因——','小核跑在更低电压点。']},
  {role:'ecore', anim:animM5, lines:['我跑在低压点，','省电是平方级。']},
  {role:'stage', lines:['powermetrics：轻载 E 核扛，','重活 P 核拉起，','整机电功率跳升。']},
  {role:'stage', lines:['越先进制程漏电越凶——','暗硅，像城市限电，','不能全开。']},
];

let cur=-1, busy=false;
async function go(){
  if(busy || cur>=STEPS.length-1) return;
  busy=true; stepBtn.disabled=true;
  cur++;
  const s=STEPS[cur];
  setAvatar(s.role);
  if(s.anim){ await s.anim(); }
  await typeLines(s.lines);
  busy=false;
  if(cur>=STEPS.length-1){ stepBtn.textContent='已到底'; }
  else { stepBtn.disabled=false; }
}

const PREV='放映-§3-分支预测.html';
const NEXT=null;
updatePower();
setScene('scSL');
stepBtn.addEventListener('click', go);
document.addEventListener('keydown', e=>{ if(e.code==='Space'){ e.preventDefault(); go(); }});
document.querySelector('.canvas').addEventListener('click', e=>{
  if(justSlider){ justSlider=false; return; }
  if(dragging) return;
  if(e.target.closest('.stage-svg')) go();
});
prevBtn.onclick=()=>{ if(PREV) location.href=PREV; };
nextBtn.onclick=()=>{};
</script>
</body>
</html>
